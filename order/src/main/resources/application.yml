spring:
  application:
    name: order
  config:
    import: classpath:chain-link.yml

chain:
  service: order
  entry-path: /orders
  next-layer:
    url: ${NEXT_LAYER_URL}
    connect-timeout: ${NEXT_LAYER_CONNECT_TIMEOUT}
    request-timeout: ${NEXT_LAYER_REQUEST_TIMEOUT}
    grpc-target: ${NEXT_LAYER_GRPC_TARGET:}   # task 05: chain.transport=grpc일 때의 아래 층(compose.yaml)
