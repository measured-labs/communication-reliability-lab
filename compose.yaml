# 이 프로젝트의 자원만 만든다: 컨테이너·네트워크·볼륨 이름이 모두 communication-reliability-lab- 로 시작한다.
# 띄우기: scripts/up.sh · 내리기: scripts/down.sh
name: communication-reliability-lab

# 측정 조건(같게 둘 것): 자원 제한, JVM 옵션, 층 사이의 타임아웃. 실행 기록에 `docker compose config`로 남는다.
x-service: &service
  restart: "no" # 죽으면 죽은 채로 둔다 — 되살아나 측정이 조용히 이어지지 않게
  mem_limit: 768m
  cpus: 2
  depends_on:
    postgres:
      condition: service_healthy

x-service-env: &service-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: lab      # 로컬 실험용 계정(비밀 값 아님 — README)
  DB_PASSWORD: lab
  # task 02의 조건: 스레드 방식. 주지 않으면 플랫폼 스레드(task 01과 같다). 실제 값은 /settings의 tomcat.executorVirtualThreads
  VIRTUAL_THREADS: ${VIRTUAL_THREADS:-false}
  # task 04의 조건: 멱등 키(docs/idempotency.md). 주지 않으면 꺼짐(task 01~03과 같다). 세 서비스에 같은 값. 실제 값은 /settings의 idempotency
  IDEMPOTENCY_ENABLED: ${IDEMPOTENCY_ENABLED:-false}
  # task 04(더 재는 조건): 아래 층의 409를 결과 모름으로 읽나. 주지 않으면 false(지금까지의 동작). 실제 값은 /settings의 idempotency.inProgressAsUnknown
  IDEMPOTENCY_IN_PROGRESS_AS_UNKNOWN: ${IDEMPOTENCY_IN_PROGRESS_AS_UNKNOWN:-false}
  # JDK HttpClient의 숨은 기본값: 연결 실패 자동 재시도(기본 켜짐)를 끈다. 나머지는 값을 명시한다.
  # keepalive.timeout(초, 기본 30): 유휴 연결을 풀에 두는 시간. 서버(Tomcat)의 keep-alive 20s보다 짧은 15s —
  # 서버가 먼저 닫은 연결을 클라이언트가 재사용하지 않게(chain-link.yml의 keep-alive-timeout).
  JAVA_TOOL_OPTIONS: >-
    -XX:MaxRAMPercentage=75
    -Djdk.httpclient.disableRetryConnect=true
    -Djdk.httpclient.enableAllMethodRetry=false
    -Djdk.httpclient.keepalive.timeout=15
    -Djdk.httpclient.connectionPoolSize=0

services:
  postgres:
    image: postgres:18.7
    restart: "no"
    mem_limit: 1g
    cpus: 2
    command: postgres -c max_connections=100
    environment:
      POSTGRES_USER: lab      # 로컬 실험용
      POSTGRES_PASSWORD: lab
    volumes:
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U lab -d payment_db"] # TCP로 — 초기화 중의 임시 서버(소켓만)를 준비됨으로 보지 않게
      interval: 2s
      retries: 30

  order:
    <<: *service
    build: { context: ., target: order }
    environment:
      <<: *service-env
      NEXT_LAYER_URL: http://inventory:8080/reservations
      NEXT_LAYER_CONNECT_TIMEOUT: 500ms
      # task 02의 조건: 주지 않으면 task 01의 값. 실제 값은 /settings의 nextLayer.requestTimeoutMs
      NEXT_LAYER_REQUEST_TIMEOUT: ${ORDER_TO_INVENTORY_TIMEOUT:-2000ms}
      # task 03의 조건: 재시도(docs/retry.md). 주지 않으면 꺼짐(task 01·02와 같다). 실제 값은 /settings의 retry
      RETRY_ENABLED: ${ORDER_RETRY_ENABLED:-false}
      RETRY_MAX_ATTEMPTS: ${ORDER_RETRY_MAX_ATTEMPTS:-1}
      RETRY_ON: ${ORDER_RETRY_ON:-failed,unknown}
      RETRY_BACKOFF: ${ORDER_RETRY_BACKOFF:-none}
      RETRY_BASE_DELAY: ${ORDER_RETRY_BASE_DELAY:-0ms}
      RETRY_MAX_DELAY: ${ORDER_RETRY_MAX_DELAY:-0ms}
      RETRY_BUDGET_ENABLED: ${ORDER_RETRY_BUDGET_ENABLED:-false}
      RETRY_BUDGET_CAPACITY: ${ORDER_RETRY_BUDGET_CAPACITY:-0}
      RETRY_BUDGET_DEPOSIT: ${ORDER_RETRY_BUDGET_DEPOSIT:-0}
    ports:
      - "8081:8080"

  inventory:
    <<: *service
    build: { context: ., target: inventory }
    environment:
      <<: *service-env
      NEXT_LAYER_URL: http://payment:8080/payments
      NEXT_LAYER_CONNECT_TIMEOUT: 500ms
      NEXT_LAYER_REQUEST_TIMEOUT: ${INVENTORY_TO_PAYMENT_TIMEOUT:-1000ms}
      # task 03의 조건: 재시도(docs/retry.md). 주지 않으면 꺼짐(task 01·02와 같다). 실제 값은 /settings의 retry
      RETRY_ENABLED: ${INVENTORY_RETRY_ENABLED:-false}
      RETRY_MAX_ATTEMPTS: ${INVENTORY_RETRY_MAX_ATTEMPTS:-1}
      RETRY_ON: ${INVENTORY_RETRY_ON:-failed,unknown}
      RETRY_BACKOFF: ${INVENTORY_RETRY_BACKOFF:-none}
      RETRY_BASE_DELAY: ${INVENTORY_RETRY_BASE_DELAY:-0ms}
      RETRY_MAX_DELAY: ${INVENTORY_RETRY_MAX_DELAY:-0ms}
      RETRY_BUDGET_ENABLED: ${INVENTORY_RETRY_BUDGET_ENABLED:-false}
      RETRY_BUDGET_CAPACITY: ${INVENTORY_RETRY_BUDGET_CAPACITY:-0}
      RETRY_BUDGET_DEPOSIT: ${INVENTORY_RETRY_BUDGET_DEPOSIT:-0}
    ports:
      - "8082:8080"

  payment:
    <<: *service
    build: { context: ., target: payment }
    environment:
      <<: *service-env
      # task 04-b의 조건: 부하에 따라 실패(docs/measurement.md 10절). 주지 않으면 꺼짐(task 01~04와 같다). 실제 값은 /settings의 overload
      OVERLOAD_ENABLED: ${PAYMENT_OVERLOAD_ENABLED:-false}
      OVERLOAD_LIMIT: ${PAYMENT_OVERLOAD_LIMIT:-0}
      OVERLOAD_WINDOW: ${PAYMENT_OVERLOAD_WINDOW:-1000ms}
    ports:
      - "8083:8080"

  # 분석기: 서비스와 함께 뜨지 않는다. scripts/run.sh가 `docker compose run --rm analyzer ...`로 부른다.
  analyzer:
    build: { context: ., target: analyzer }
    profiles: [tools]
    mem_limit: 1g
    cpus: 2
    volumes:
      - ./runs:/runs

volumes:
  pgdata:
