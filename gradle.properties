# 버전의 한 곳. 확인한 곳은 docs/dependencies.md.
kotlinVersion=2.4.21
springBootVersion=4.2.0

# 툴체인(JDK 25)이 없으면 내려받지 말고 실패한다 — JDK 25는 컨테이너의 빌드 단계에만 있다.
org.gradle.java.installations.auto-download=false

# task 05(gRPC — docs/dependencies.md "task 05에서 정한 것"). protobuf Gradle 플러그인은 Boot 문서의 예와 같은 판.
# protoc·protoc-gen-grpc-java의 판은 Boot 4.2.0 BOM(spring-boot-dependencies-4.2.0.pom)의 protobuf-java.version·grpc-java.version과 같게 적는다 —
# Boot Gradle 플러그인이 판을 맞추는 것은 Boot 플러그인을 쓴 모듈뿐인데, .proto는 라이브러리 모듈 chain-link에 있다.
protobufPluginVersion=0.9.6
protocVersion=4.36.2
grpcJavaVersion=1.84.1
